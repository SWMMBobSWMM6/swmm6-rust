[package]
name = "swmm6-rust"
description = "The OpenSWMM 6 1D engine translated into safe Rust, gated byte for byte against OpenSWMM 6"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "swmm6_rust"
path = "src/lib.rs"

[features]
# Gate tools only, off by default: write access to private engine members for the context
# loader (examples/common/ctxload.rs) and for the initqual harness's massbal mode.
gate = []
# Upstream's OPENSWMM_HAS_2D (the 2D surface routing module). Off: the engine matches the 1D
# reference build; on: the 2D reference build (PLAN.md, phase 2a).
twod = []

[[example]]
name = "ctxopen2d"
required-features = ["twod"]

[[example]]
name = "snap2d"
required-features = ["twod", "gate"]

[[example]]
name = "ctxload"
required-features = ["gate"]

[[example]]
name = "initqual"
required-features = ["gate"]

[[example]]
name = "outgate"
required-features = ["gate"]

# Phase 2a wave 2: the 2D leaf-numerics differentials (gate/twodkern.sh runs them all)

[[example]]
name = "twod_vfr"
required-features = ["twod"]

[[example]]
name = "twod_quadvfr"
required-features = ["twod"]

[[example]]
name = "twod_inertial"
required-features = ["twod"]

[[example]]
name = "twod_swe"
required-features = ["twod"]

[[example]]
name = "twod_diffusive"
required-features = ["twod"]

[[example]]
name = "twod_sinks"
required-features = ["twod"]

[[example]]
name = "twod_momentum"
required-features = ["twod"]

[[example]]
name = "twod_exchange"
required-features = ["twod"]

[[example]]
name = "twod_pond"
required-features = ["twod"]
